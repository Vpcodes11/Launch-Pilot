name: Launch Pilot verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run isolated demo smoke tests
        env:
          NEXT_PUBLIC_LAUNCHPILOT_DEMO: "true"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          BASE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/launchpilot-dev.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl --fail --silent --max-time 3 "$BASE_URL" > /dev/null; then
              node scripts/test-deployment.ts
              exit $?
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat /tmp/launchpilot-dev.log
          exit 1
      - name: Upload server log when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launchpilot-dev-log
          path: /tmp/launchpilot-dev.log
          if-no-files-found: ignore
